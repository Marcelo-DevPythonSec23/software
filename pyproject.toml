[project]
name = "forensic-cti"
version = "0.2.0"
description = "Plataforma inteligente de análise forense digital e Cyber Threat Intelligence (CTI)"

authors = [
  { name = "Plataforma Forense & CTI", email = "devmarcelo309vg@gmail.com" }
]

readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.0",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "elasticsearch>=8.0.0",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "numpy>=1.24",
    "polars>=0.19",
    "python-dotenv>=1.0",
    "alembic>=1.12",
]

[project.urls]
Homepage = "https://marcelo-devpythonsec23.github.io/"
Repository = "https://github.com/marcelo-devpythonsec23/forensic-cti"
Documentation = "https://marcelo-devpythonsec23.github.io/"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "httpx2",
    "black",
    "ruff",
    "mypy"
]

[tool.setuptools]
package-dir = {"" = "software/backend"}

[tool.setuptools.packages.find]
where = ["software/backend"]

[tool.pytest.ini_options]
pythonpath = ["software/backend"]
testpaths = ["software/backend/tests"]
asyncio_mode = "strict"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"